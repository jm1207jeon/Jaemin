name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  publish-windows:
    name: Publish win-x64 exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # 단일 거대 exe 대신 모듈별 파일이 정리된 폴더 배포 (exe는 작고, 라이브러리는 dll로 분리)
      - name: Publish (self-contained, multi-file layout)
        run: >
          dotnet publish src/QmsWeaver.App -c Release -r win-x64
          --self-contained true
          -o publish/win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QmsWeaver-win-x64
          path: publish/win-x64/

  release:
    name: GitHub Release (on tag)
    runs-on: ubuntu-latest
    needs: publish-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QmsWeaver-win-x64
          path: dist
      - name: Zip
        run: cd dist && zip -r ../QmsWeaver-win-x64.zip .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: QmsWeaver-win-x64.zip
          generate_release_notes: true
